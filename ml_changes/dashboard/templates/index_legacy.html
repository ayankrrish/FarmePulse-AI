<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FarmPulse AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #12201A;
    --bg-raised: #1A2B22;
    --paper: #F3F1E7;
    --sage: #8FA391;
    --gold: #D4A94A;
    --rust: #B4432E;
    --teal: #4FB3A9;
    --line: rgba(243,241,231,0.12);
  }

  * { box-sizing: border-box; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; } }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--paper);
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
  }

  .wrap { max-width: 780px; margin: 0 auto; padding: 32px 20px 80px; }

  .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; }
  .wordmark { font-family: 'Fraunces', serif; font-weight: 600; font-size: 24px; letter-spacing: -0.01em; }
  .wordmark span { color: var(--gold); }
  .lang-toggle { display: flex; border: 1px solid var(--line); border-radius: 20px; overflow: hidden; }
  .lang-toggle button {
    background: none; border: none; color: var(--sage); font-family: 'Space Grotesk';
    padding: 7px 16px; font-size: 13px; cursor: pointer; transition: all 0.2s;
  }
  .lang-toggle button.active { background: var(--gold); color: var(--bg); font-weight: 600; }

  .eyebrow { font-family: 'IBM Plex Mono'; font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--teal); margin-bottom: 8px; }
  .headline { font-family: 'Fraunces', serif; font-size: 32px; font-weight: 600; line-height: 1.15; margin: 0 0 32px; color: var(--paper); }

  .ticker {
    background: var(--bg-raised);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 28px 24px;
    margin-bottom: 24px;
    position: relative;
    overflow: hidden;
  }
  .ticker::before {
    content: "";
    position: absolute; inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 27px, var(--line) 28px);
    opacity: 0.4; pointer-events: none;
  }
  .ticker-row { display: flex; justify-content: space-between; align-items: baseline; position: relative; z-index: 1; flex-wrap: wrap; gap: 16px; }
  .ticker-block .tlabel { font-family: 'IBM Plex Mono'; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--sage); margin-bottom: 6px; }
  .ticker-block .tvalue { font-family: 'IBM Plex Mono'; font-size: 34px; font-weight: 600; color: var(--paper); }
  .ticker-block.predicted .tvalue { color: var(--gold); }
  .tvalue .pct { font-size: 16px; margin-left: 8px; font-weight: 500; }
  .pct.up { color: var(--teal); } .pct.down { color: var(--rust); }
  .msp-track { margin-top: 20px; position: relative; z-index: 1; height: 4px; background: var(--line); border-radius: 2px; }
  .msp-marker { position: absolute; top: -6px; width: 2px; height: 16px; background: var(--rust); }
  .msp-marker::after { content: "MSP ₹" attr(data-msp); position: absolute; top: -22px; left: 50%; transform: translateX(-50%);
    font-family: 'IBM Plex Mono'; font-size: 10px; color: var(--rust); white-space: nowrap; }
  .method-tag { font-family: 'IBM Plex Mono'; font-size: 12px; color: var(--sage); margin-top: 20px; position: relative; z-index: 1; }

  .controls { display: flex; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
  .pill-select { position: relative; flex: 1; min-width: 140px; }
  .pill-select select {
    width: 100%; appearance: none; background: var(--bg-raised); color: var(--paper);
    border: 1px solid var(--line); border-radius: 10px; padding: 12px 36px 12px 14px;
    font-family: 'Space Grotesk'; font-size: 15px; font-weight: 500; cursor: pointer;
  }
  .pill-select select:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .pill-select::after { content: "▾"; position: absolute; right: 14px; top: 50%; transform: translateY(-50%); color: var(--sage); pointer-events: none; }
  .voice-btn {
    background: var(--gold); color: var(--bg); border: none; border-radius: 10px;
    width: 48px; font-size: 18px; cursor: pointer; transition: background 0.2s;
  }
  .voice-btn:hover { background: #e0b95c; }
  .voice-btn.listening { background: var(--rust); color: var(--paper); animation: pulse 1s infinite; }
  .voice-btn:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.55; } }
  #voiceStatus { font-family: 'IBM Plex Mono'; font-size: 12px; color: var(--sage); min-height: 18px; margin: 8px 0 28px; }

  .card {
    background: var(--bg-raised); border: 1px solid var(--line); border-radius: 14px;
    padding: 20px 22px; margin-bottom: 18px;
    opacity: 0; transform: translateY(10px);
    animation: rise 0.5s ease forwards;
  }
  .card:nth-of-type(2) { animation-delay: 0.06s; }
  .card:nth-of-type(3) { animation-delay: 0.12s; }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }

  .stamp { display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 10px; font-size: 14px; font-family: 'Space Grotesk'; }
  .stamp.below { background: rgba(180,67,46,0.15); color: #e58a76; border: 1px solid rgba(180,67,46,0.4); }
  .stamp.above { background: rgba(79,179,169,0.15); color: var(--teal); border: 1px solid rgba(79,179,169,0.4); }

  .card h3 { font-family: 'Fraunces', serif; font-weight: 600; font-size: 18px; margin: 0 0 14px; color: var(--paper); }
  .qty-row { display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--sage); }
  input[type=number] {
    background: var(--bg); color: var(--paper); border: 1px solid var(--line); border-radius: 8px;
    padding: 9px 12px; width: 90px; font-family: 'IBM Plex Mono'; font-size: 15px;
  }
  input[type=number]:focus-visible { outline: 2px solid var(--gold); }
  #revenue { font-family: 'IBM Plex Mono'; font-size: 24px; font-weight: 600; color: var(--gold); margin-top: 14px; }

  .speak-btn {
    background: none; border: 1px solid var(--line); color: var(--sage); border-radius: 8px;
    padding: 8px 14px; cursor: pointer; font-size: 13px; margin-top: 16px; font-family: 'Space Grotesk';
    transition: all 0.2s;
  }
  .speak-btn:hover { border-color: var(--gold); color: var(--gold); }
  .speak-btn:focus-visible { outline: 2px solid var(--gold); }

  canvas { max-height: 220px; }

  footer { text-align: center; font-family: 'IBM Plex Mono'; font-size: 11px; color: var(--sage); margin-top: 40px; opacity: 0.6; }

  @media (max-width: 480px) {
    .headline { font-size: 26px; }
    .tvalue { font-size: 26px !important; }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="topbar">
    <div class="wordmark">Farm<span>Pulse</span></div>
    <div class="lang-toggle">
      <button id="langEn" class="active" data-lang="en">EN</button>
      <button id="langHi" data-lang="hi">हि</button>
    </div>
  </div>

  <div class="eyebrow" id="eyebrowText">Live mandi intelligence</div>
  <h1 class="headline" id="subtitleText">Pulse crop price forecasting for Indian mandis</h1>

  <div class="controls">
    <div class="pill-select"><select id="cropSelect"></select></div>
    <div class="pill-select"><select id="stateSelect"></select></div>
    <button class="voice-btn" id="voiceBtn" title="Voice input">🎤</button>
  </div>
  <div class="controls" style="margin-top:2px;">
    <div class="pill-select" style="flex:1;">
      <input type="month" id="targetDate" autocomplete="off" style="width:100%; background:var(--bg-raised); color:var(--paper);
        border:1px solid var(--line); border-radius:10px; padding:12px 14px; font-family:'Space Grotesk';
        font-size:15px; font-weight:500;">
    </div>
  </div>
  <p id="dateHint" style="font-family:'IBM Plex Mono'; font-size:12px; color:var(--sage); margin:8px 0 20px;"></p>
  <p id="voiceStatus"></p>

  <div id="result"></div>

  <footer>FarmPulse AI — Phase II — data.gov.in &amp; CEDA Agmarknet</footer>
</div>

<script>
const TRANSLATIONS = {
  en: {
    eyebrow: "Live mandi intelligence",
    subtitle: "Pulse crop price forecasting for Indian mandis",
    currentPrice: "Current price", predictedPrice: "Predicted — next month", msp: "MSP",
    methodUsed: "Method", profitEstimator: "Profit estimator",
    quantity: "Quantity, quintals", estimatedRevenue: "Estimated revenue",
    priceHistory: "Recent price history", listenBtn: "🔊 Listen to result",
    mspAlertBelow: "Below MSP — consider government procurement channels",
    mspAlertAbove: "Above MSP by",
    voiceIdle: "Tap the mic and say a state or crop name",
    voiceListening: "Listening…", voiceNotSupported: "Voice input isn't supported in this browser — try Chrome.",
  },
  hi: {
    eyebrow: "लाइव मंडी जानकारी",
    subtitle: "भारतीय मंडियों के लिए दलहन फसल मूल्य पूर्वानुमान",
    currentPrice: "वर्तमान मूल्य", predictedPrice: "अनुमान — अगला माह", msp: "एमएसपी",
    methodUsed: "पद्धति", profitEstimator: "लाभ अनुमानक",
    quantity: "मात्रा, क्विंटल", estimatedRevenue: "अनुमानित आय",
    priceHistory: "हाल का मूल्य इतिहास", listenBtn: "🔊 परिणाम सुनें",
    mspAlertBelow: "एमएसपी से कम — सरकारी खरीद केंद्रों पर विचार करें",
    mspAlertAbove: "एमएसपी से अधिक",
    voiceIdle: "माइक दबाएं और राज्य या फसल का नाम बोलें",
    voiceListening: "सुन रहा है…", voiceNotSupported: "इस ब्राउज़र में वॉइस इनपुट समर्थित नहीं है — Chrome आज़माएं।",
  }
};

const STATE_HI = {
  "Madhya Pradesh": "मध्य प्रदेश", "Maharashtra": "महाराष्ट्र", "Rajasthan": "राजस्थान",
  "Uttar Pradesh": "उत्तर प्रदेश", "Karnataka": "कर्नाटक", "Telangana": "तेलंगाना",
  "Andhra Pradesh": "आंध्र प्रदेश", "Gujarat": "गुजरात",
};
const CROP_HI = { "Chana": "चना", "Moong": "मूंग", "Tur": "तूर" };

let config = {};
let currentLang = "en";
let lastPredictionData = null;

function t(key) { return TRANSLATIONS[currentLang][key]; }
function displayName(type, en) {
  if (currentLang !== "hi") return en;
  return type === "state" ? (STATE_HI[en] || en) : (CROP_HI[en] || en);
}

async function loadConfig() {
  const res = await fetch("/api/config");
  config = await res.json();
  populateDropdowns();
}

function populateDropdowns() {
  const cropSelect = document.getElementById("cropSelect");
  const currentCrop = cropSelect.value || Object.keys(config)[0];
  cropSelect.innerHTML = "";
  Object.keys(config).forEach(crop => {
    const opt = document.createElement("option");
    opt.value = crop; opt.textContent = displayName("crop", crop);
    cropSelect.appendChild(opt);
  });
  cropSelect.value = currentCrop;
  updateStates();
}

function updateStates() {
  const crop = document.getElementById("cropSelect").value;
  const stateSelect = document.getElementById("stateSelect");
  const currentState = stateSelect.value;
  stateSelect.innerHTML = "";
  config[crop].forEach(state => {
    const opt = document.createElement("option");
    opt.value = state; opt.textContent = displayName("state", state);
    stateSelect.appendChild(opt);
  });
  if (config[crop].includes(currentState)) stateSelect.value = currentState;
}

function applyLanguage() {
  document.getElementById("eyebrowText").textContent = t("eyebrow");
  document.getElementById("subtitleText").textContent = t("subtitle");
  document.getElementById("voiceStatus").textContent = t("voiceIdle");
  populateDropdowns();
  if (lastPredictionData) renderResult(lastPredictionData);
}

function animateNumber(el, from, to, duration = 700) {
  const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduced) { el.textContent = `₹${Math.round(to).toLocaleString("en-IN")}`; return; }
  const start = performance.now();
  function tick(now) {
    const progress = Math.min((now - start) / duration, 1);
    const eased = 1 - Math.pow(1 - progress, 3);
    const value = from + (to - from) * eased;
    el.textContent = `₹${Math.round(value).toLocaleString("en-IN")}`;
    if (progress < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

let chartInstance = null;

async function loadPrediction() {
  const crop = document.getElementById("cropSelect").value;
  const state = document.getElementById("stateSelect").value;
  const targetInput = document.getElementById("targetDate").value;
  let url = `/api/predict?crop=${crop}&state=${state}`;
  if (targetInput) url += `&target_date=${targetInput}`;

  const res = await fetch(url);
  const data = await res.json();
  if (data.error) {
    document.getElementById("dateHint").textContent = data.error;
    document.getElementById("dateHint").style.color = "#e58a76";
    return;
  }
  document.getElementById("dateHint").style.color = "var(--sage)";

  // On first load (no manual date chosen yet), set the picker to next month
  if (!targetInput) {
    document.getElementById("targetDate").value = data.target_month;
  }
  const stepsLabel = data.steps_ahead === 1 ? "1 month ahead" : `${data.steps_ahead} months ahead`;
  document.getElementById("dateHint").textContent =
    `Forecasting ${stepsLabel} to ${data.target_month} — longer horizons carry more uncertainty`;

  const previous = lastPredictionData;
  lastPredictionData = data;
  renderResult(data, previous);
}

function renderResult(data, previous) {
  const changeClass = data.change_pct >= 0 ? "up" : "down";
  const changeSign = data.change_pct >= 0 ? "+" : "";
  const cropName = displayName("crop", data.crop);
  const stateName = displayName("state", data.state);
  const mspPct = Math.min(95, Math.max(5, (data.msp / Math.max(data.current_price, data.predicted_price, data.msp)) * 90));

  const stampHtml = data.below_msp
    ? `<div class="stamp below">⚠ ${t("mspAlertBelow")} — ₹${data.predicted_price} / ₹${data.msp}</div>`
    : `<div class="stamp above">✓ ${t("mspAlertAbove")} ₹${(data.predicted_price - data.msp).toFixed(0)}</div>`;

  document.getElementById("result").innerHTML = `
    <div class="ticker">
      <h2 style="font-family:'Fraunces',serif; font-weight:600; font-size:19px; margin:0 0 18px; position:relative; z-index:1;">${cropName} — ${stateName}</h2>
      <div class="ticker-row">
        <div class="ticker-block">
          <div class="tlabel">${t("currentPrice")}</div>
          <div class="tvalue" id="curVal">₹0</div>
        </div>
        <div class="ticker-block predicted">
          <div class="tlabel">${t("predictedPrice")} · ${data.target_month}</div>
          <div class="tvalue" id="predVal">₹0<span class="pct ${changeClass}">${changeSign}${data.change_pct}%</span></div>
        </div>
      </div>
      <div class="msp-track"><div class="msp-marker" style="left:${mspPct}%;" data-msp="${data.msp}"></div></div>
      <div class="method-tag">${t("methodUsed")}: ${data.method_used}</div>
      ${data.method_used.includes("Persistence") && !data.method_used.includes("Trend") && data.steps_ahead > 1
        ? `<div class="method-tag" style="color:#e58a76; margin-top:6px;">⚠ This method assumes price stays flat, so forecasts beyond 1 month show the same value regardless of how far ahead you look.</div>`
        : ""}
    </div>

    <div class="card">${stampHtml}
      <button class="speak-btn" onclick="speakResult()">${t("listenBtn")}</button>
    </div>

    <div class="card">
      <h3>${t("profitEstimator")}</h3>
      <div class="qty-row">
        ${t("quantity")}: <input type="number" id="quantity" value="10" min="1" onchange="updateRevenue(${data.predicted_price})">
      </div>
      <div id="revenue">${t("estimatedRevenue")}: ₹${(data.predicted_price * 10).toLocaleString("en-IN")}</div>
    </div>

    <div class="card">
      <h3>${t("priceHistory")}</h3>
      <canvas id="priceChart"></canvas>
    </div>
  `;

  animateNumber(document.getElementById("curVal"), previous ? previous.current_price : data.current_price, data.current_price);
  const predEl = document.getElementById("predVal");
  animateNumber(predEl, previous ? previous.predicted_price : data.predicted_price, data.predicted_price);
  setTimeout(() => { predEl.innerHTML = `₹${Math.round(data.predicted_price).toLocaleString("en-IN")}<span class="pct ${changeClass}">${changeSign}${data.change_pct}%</span>`; }, 720);

  if (chartInstance) chartInstance.destroy();
  const ctx = document.getElementById("priceChart").getContext("2d");
  Chart.defaults.color = "#8FA391";
  Chart.defaults.font.family = "'IBM Plex Mono', monospace";

  const historyLabels = data.history.map(h => h.date);
  const allLabels = historyLabels.concat(data.forecast_labels);
  const historyValues = data.history.map(h => h.modal_price);
  // Forecast dataset: null for all historical points, then the actual path,
  // with the last historical value repeated first so the dotted line connects
  const forecastValues = new Array(historyValues.length - 1).fill(null)
    .concat([historyValues[historyValues.length - 1]])
    .concat(data.forecast_path);
  const mspLine = allLabels.map(() => data.msp);

  chartInstance = new Chart(ctx, {
    type: "line",
    data: {
      labels: allLabels,
      datasets: [
        { label: "Modal price", data: historyValues, borderColor: "#D4A94A", backgroundColor: "rgba(212,169,74,0.08)", fill: true, tension: 0.25, pointRadius: 0 },
        { label: "Forecast", data: forecastValues, borderColor: "#4FB3A9", borderDash: [4, 4], pointRadius: 2, fill: false, tension: 0.25 },
        { label: "MSP", data: mspLine, borderColor: "#B4432E", borderDash: [6, 4], pointRadius: 0 }
      ]
    },
    options: {
      animation: { duration: 900, easing: "easeOutCubic" },
      plugins: { legend: { labels: { boxWidth: 12 } } },
      scales: { x: { grid: { color: "rgba(243,241,231,0.06)" } }, y: { grid: { color: "rgba(243,241,231,0.06)" } } }
    }
  });
}

function updateRevenue(predictedPrice) {
  const qty = document.getElementById("quantity").value;
  document.getElementById("revenue").textContent = `${t("estimatedRevenue")}: ₹${Math.round(predictedPrice * qty).toLocaleString("en-IN")}`;
}

function speakResult() {
  if (!lastPredictionData || !("speechSynthesis" in window)) return;
  const d = lastPredictionData;
  const cropName = displayName("crop", d.crop);
  const stateName = displayName("state", d.state);
  let sentence;
  if (currentLang === "hi") {
    sentence = `${stateName} में ${cropName} का वर्तमान मूल्य ${d.current_price} रुपये है। अगले महीने का अनुमानित मूल्य ${d.predicted_price} रुपये है। ${d.below_msp ? "यह एमएसपी से कम है।" : "यह एमएसपी से अधिक है।"}`;
  } else {
    sentence = `Current price of ${cropName} in ${stateName} is ${d.current_price} rupees. Predicted price next month is ${d.predicted_price} rupees. ${d.below_msp ? "This is below MSP." : "This is above MSP."}`;
  }
  const utterance = new SpeechSynthesisUtterance(sentence);
  utterance.lang = currentLang === "hi" ? "hi-IN" : "en-IN";
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(utterance);
}

function setupVoiceInput() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  const voiceBtn = document.getElementById("voiceBtn");
  const statusEl = document.getElementById("voiceStatus");
  if (!SpeechRecognition) { statusEl.textContent = t("voiceNotSupported"); voiceBtn.disabled = true; return; }
  const recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = false;
  voiceBtn.addEventListener("click", () => {
    recognition.lang = currentLang === "hi" ? "hi-IN" : "en-IN";
    voiceBtn.classList.add("listening");
    statusEl.textContent = t("voiceListening");
    recognition.start();
  });
  recognition.onresult = (event) => handleVoiceTranscript(event.results[0][0].transcript.trim());
  recognition.onend = () => { voiceBtn.classList.remove("listening"); statusEl.textContent = t("voiceIdle"); };
  recognition.onerror = () => { voiceBtn.classList.remove("listening"); statusEl.textContent = t("voiceIdle"); };
}

function handleVoiceTranscript(transcript) {
  const lower = transcript.toLowerCase();
  for (const crop of Object.keys(config)) {
    if (lower.includes(crop.toLowerCase()) || transcript.includes(CROP_HI[crop])) {
      document.getElementById("cropSelect").value = crop;
      updateStates();
      break;
    }
  }
  const crop = document.getElementById("cropSelect").value;
  for (const state of config[crop]) {
    if (lower.includes(state.toLowerCase()) || transcript.includes(STATE_HI[state])) {
      document.getElementById("stateSelect").value = state;
      break;
    }
  }
  loadPrediction();
}

document.addEventListener("DOMContentLoaded", async () => {
  document.getElementById("targetDate").value = "";  // never trust browser-restored values on load
  await loadConfig();
  setupVoiceInput();
  document.getElementById("voiceStatus").textContent = t("voiceIdle");
  document.getElementById("cropSelect").addEventListener("change", () => { updateStates(); loadPrediction(); });
  document.getElementById("stateSelect").addEventListener("change", loadPrediction);
  document.getElementById("targetDate").addEventListener("change", loadPrediction);
  document.querySelectorAll(".lang-toggle button").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".lang-toggle button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentLang = btn.dataset.lang;
      applyLanguage();
    });
  });
  loadPrediction();
});
</script>

</body>
</html>
